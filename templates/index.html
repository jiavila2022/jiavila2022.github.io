    <label for="numTeams">Number of Teams:</label>

    <select id="numTeams">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
    </select>

    <br><br>

    <button onclick="submitPeople()">Submit</button>

    <p id="result"></p>

    <img id="summaryImage" style="max-width: 100%; display: none;">

    <script>
        async function submitPeople() {
            const checkedBoxes = document.querySelectorAll(
                'input[name="person"]:checked'
            );

            const selectedNames = Array.from(checkedBoxes).map(
                checkbox => checkbox.value
            );

            const numTeams = parseInt(
                document.getElementById("numTeams").value
            );

            const response = await fetch("/make-teams", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    names: selectedNames,
                    num_teams: numTeams
                })
            });

            const result = await response.json();

            // Display teams
            document.getElementById("result").innerHTML =
                result.teams;

            // Display heatmap
            const image = document.getElementById("summaryImage");

            image.src = "data:image/png;base64," + result.image;
            image.style.display = "block";
        }
    </script>
